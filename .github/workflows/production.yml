name: Build and deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: enterprise-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            target: prod
          - name: migrate
            context: backend
            target: build
          - name: frontend
            context: frontend
            target: prod
          - name: crm-ai-worker
            context: analytics
            target: prod
    steps:
      - uses: actions/checkout@v4
      - name: Image namespace
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Verify pnpm lockfiles
        run: test -s backend/pnpm-lock.yaml && test -s frontend/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=/api/v1
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror infrastructure
        shell: bash
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for item in 'postgres postgres:16-alpine' 'redis redis:7-alpine' 'rabbitmq rabbitmq:3.13-management-alpine' 'nginx nginx:1.27-alpine'; do
            read -r name source <<< "$item"
            target="$prefix-$name:$GITHUB_SHA"
            docker pull --platform linux/amd64 "$source"
            docker tag "$source" "$target"
            docker push "$target"
          done
  deploy:
    needs: [build, mirror]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH and deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?}" "${SSH_USER:?}" "${SSH_PRIVATE_KEY:?}" "${SSH_KNOWN_HOSTS:?}" "${DEPLOY_PATH:?}"
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          opts=(-i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          target="$SSH_USER@$SSH_HOST"
          ssh "${opts[@]}" "$target" "mkdir -p '$DEPLOY_PATH/.incoming/$GITHUB_SHA'"
          tar -czf - docker-compose.test.yml nginx/nginx.httpskasra.conf scripts/deploy.sh | ssh "${opts[@]}" "$target" "tar -xzf - -C '$DEPLOY_PATH/.incoming/$GITHUB_SHA'"
          ssh "${opts[@]}" "$target" "bash '$DEPLOY_PATH/.incoming/$GITHUB_SHA/scripts/deploy.sh' '$DEPLOY_PATH' 'ghcr.io/${GITHUB_REPOSITORY,,}' '$GITHUB_SHA'"
