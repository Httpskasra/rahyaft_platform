name: enterprise-test

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_test_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  migrate:
    build:
      context: ./backend
      target: build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: npx prisma migrate deploy
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      API_VERSION: ${API_VERSION:-1.0.0}
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      AI_ANALYTICS_BASE_URL: ${AI_ANALYTICS_BASE_URL:-https://api.avalai.ir/v1}
      AI_ANALYTICS_API_KEY: ${AI_ANALYTICS_API_KEY:?AI_ANALYTICS_API_KEY is required}
      AI_ANALYTICS_MODEL: ${AI_ANALYTICS_MODEL:-cf.gpt-oss-120b}
      AI_ANALYTICS_API_STYLE: ${AI_ANALYTICS_API_STYLE:-auto}
      AI_ANALYTICS_LANGUAGE: ${AI_ANALYTICS_LANGUAGE:-fa}
      AI_ANALYTICS_TIMEOUT_MS: ${AI_ANALYTICS_TIMEOUT_MS:-45000}
      AI_ANALYTICS_MAX_OUTPUT_TOKENS: ${AI_ANALYTICS_MAX_OUTPUT_TOKENS:-8192}
      AI_ANALYTICS_INCLUDE_IDENTIFIERS: ${AI_ANALYTICS_INCLUDE_IDENTIFIERS:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - communication_uploads:/usr/src/app/uploads/communication
      - signature_uploads:/usr/src/app/uploads/signatures
    networks: [internal, public]
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    networks: [public]
    security_opt:
      - no-new-privileges:true

  crm-ai-worker:
    build:
      context: ./analytics
      target: prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      DOMAIN_EXCHANGE: ${DOMAIN_EXCHANGE:-domain_events}
      CRM_QUEUE: ${CRM_QUEUE:-crm_ai_worker}
      AVALAI_BASE_URL: ${AVALAI_BASE_URL:-https://api.avalai.ir/v1}
      AVALAI_API_KEY: ${AVALAI_API_KEY:?AVALAI_API_KEY is required}
      AVALAI_MODEL: ${AVALAI_MODEL:-cf.gpt-oss-120b}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "src/crm_worker.py"]
    networks: [internal, public]
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true
  public:

volumes:
  communication_uploads:
  signature_uploads:
  postgres_test_data:
  redis_test_data:
  rabbitmq_test_data:
